{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6">

  <h1 class="text-2xl font-bold text-[var(--gcc-red)] mb-4">
    Attendance for {{ student.first_name }} {{ student.last_name }}
  </h1>

  <!-- Add Attendance -->
  <form method="POST" class="mb-6 flex gap-2 items-center">
    <input type="date" name="date" required class="border px-3 py-2 rounded">
    <select name="status" required class="border px-3 py-2 rounded">
      <option value="">Select Status</option>
      <option value="Present">Present</option>
      <option value="Absent">Absent</option>
      <option value="Late">Late</option>
    </select>
    <button type="submit" class="bg-[var(--gcc-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">Add</button>
  </form>

  <!-- Attendance Records -->
  <div class="bg-white shadow-md rounded-lg overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        {% for record in records %}
        <tr>
          <td class="px-6 py-4">{{ record.date }}</td>
          <td class="px-6 py-4">{{ record.status }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="2" class="px-6 py-4 text-center text-gray-500">No attendance recorded yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</div>
{% endblock %}
