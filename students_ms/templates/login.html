{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-2xl font-bold text-[var(--gcc-red)] text-center mb-6">Login</h2>

    <form method="POST" class="space-y-4">
        <div>
            <label for="email" class="block font-medium mb-1">Email</label>
            <input type="email" name="email" id="email" required
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--gcc-red)]">
        </div>

        <div>
            <label for="password" class="block font-medium mb-1">Password</label>
            <input type="password" name="password" id="password" required
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--gcc-red)]">
        </div>

        <button type="submit" class="w-full bg-[var(--gcc-red)] text-white font-bold py-2 rounded hover:bg-red-700 transition">
            Login
        </button>

        <div class="text-center mt-2">
            <a href="{{ url_for('forgot_password') }}" class="text-[var(--gcc-red)] hover:underline text-sm">Forgot Password?</a>
        </div>
    </form>

    <p class="text-center text-gray-600 mt-4 text-sm">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-[var(--gcc-red)] hover:underline">Register</a>
    </p>
</div>
{% endblock %}
