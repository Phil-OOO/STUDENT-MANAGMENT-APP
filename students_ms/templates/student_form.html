{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12 bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-2xl font-bold text-[var(--gcc-red)] text-center mb-6">Add Student</h2>

    <form method="POST" class="space-y-4">
        <div>
            <label for="first_name" class="block font-medium mb-1">First Name</label>
            <input type="text" name="first_name" id="first_name" required
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--gcc-red)]">
        </div>

        <div>
            <label for="last_name" class="block font-medium mb-1">Last Name</label>
            <input type="text" name="last_name" id="last_name"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--gcc-red)]">
        </div>

        <div>
            <label for="parent_name" class="block font-medium mb-1">Parent Name</label>
            <input type="text" name="parent_name" id="parent_name"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--gcc-red)]">
        </div>

        <div>
            <label for="parent_phone" class="block font-medium mb-1">Parent Phone</label>
            <input type="text" name="parent_phone" id="parent_phone"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--gcc-red)]">
        </div>

        <button type="submit" class="w-full bg-[var(--gcc-red)] text-white font-bold py-2 rounded hover:bg-red-700 transition">
            Add Student
        </button>
    </form>
</div>
{% endblock %}
