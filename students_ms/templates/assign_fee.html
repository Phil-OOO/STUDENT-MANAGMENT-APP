{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6 max-w-lg">
  <h1 class="text-2xl font-bold text-[var(--gcc-red)] mb-4">
    Assign Fee — {{ student.first_name }} {{ student.last_name or '' }}
  </h1>

  {% if fee_structures %}
  <form method="POST" class="bg-white p-4 rounded shadow flex flex-col gap-4">
    <div>
      <label class="font-medium block mb-1">Select Fee Structure</label>
      <select name="fee_structure_id" required
              class="border border-gray-300 rounded px-3 py-2 w-full">
        {% for fs in fee_structures %}
        <option value="{{ fs.id }}">
          {{ fs.class_name }} — {{ fs.term }} {{ fs.academic_year }} (GHS {{ fs.total_fee }})
        </option>
        {% endfor %}
      </select>
    </div>
    <button type="submit"
            class="bg-[var(--gcc-red)] text-white px-4 py-2 rounded hover:bg-red-700 transition">
      Assign Fee
    </button>
  </form>
  {% else %}
  <div class="bg-yellow-50 border border-yellow-300 text-yellow-700 p-4 rounded">
    No available fee structures to assign. 
    <a href="{{ url_for('create_fee') }}" class="underline font-semibold">Create one first.</a>
  </div>
  {% endif %}

  <a href="{{ url_for('student_detail', id=student.id) }}"
     class="inline-block mt-4 text-sm text-gray-500 hover:underline">
    ← Back to student
  </a>
</div>
{% endblock %}
